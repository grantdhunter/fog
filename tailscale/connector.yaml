apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: home-cidr
spec:
  # Applies the resource requests/limits defined in proxyclass-home.yaml to the
  # proxy StatefulSet this Connector creates.
  proxyClass: fog
  tags:
  - "tag:k8s"
  hostname: home-cidr
  subnetRouter:
    advertiseRoutes:
      - "192.168.1.0/24"
  exitNode: true
